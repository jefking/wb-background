<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memory Vault</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Memory-only privacy provider</p>
        <h1>Key Cabinet</h1>
      </div>
      <span id="connection-status" class="status waiting">Waiting for broker</span>
    </header>

    <div class="notice">
      Values stay in this iframe’s memory. Variables are visible here; secrets are masked but are not encrypted yet. Reloading or swapping this frame erases everything.
    </div>

    <section class="editor" aria-labelledby="editor-title">
      <h2 id="editor-title">Add or update a vault entry</h2>
      <div class="field">
        <label for="entry-kind">Type</label>
        <select id="entry-kind">
          <option value="secret" selected>Secret · hidden</option>
          <option value="variable">Variable · visible</option>
        </select>
      </div>
      <div class="field">
        <label for="entry-key">Key</label>
        <input id="entry-key" value="weather.city" maxlength="128" autocomplete="off" spellcheck="false">
      </div>
      <div class="field value-field">
        <label for="entry-value">Value</label>
        <input id="entry-value" type="password" maxlength="16384" autocomplete="new-password" spellcheck="false" placeholder="e.g. Vancouver">
      </div>
      <button id="save-entry" type="button">Save in memory</button>
      <p id="editor-message" aria-live="polite"></p>
    </section>

    <section class="inventory" aria-labelledby="inventory-title">
      <div class="inventory-heading">
        <h2 id="inventory-title">Stored entries</h2>
        <span id="key-count">0</span>
      </div>
      <div id="key-list" aria-live="polite"></div>
    </section>

    <script type="module" src="/privacy.js"></script>
  </body>
</html>

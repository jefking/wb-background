<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memory Vault</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Memory-only privacy provider</p>
        <h1>Key Cabinet</h1>
      </div>
      <span id="connection-status" class="status waiting">Waiting for broker</span>
    </header>

    <div class="notice">
      Values stay in this iframe’s memory. Variables are visible here; secrets are masked but are not encrypted yet. Reloading or swapping this frame erases everything.
    </div>

    <section class="editor" aria-labelledby="editor-title">
      <h2 id="editor-title">Add or update a vault entry</h2>
      <div class="field kind-field">
        <span id="entry-kind-label" class="field-label">Type</span>
        <div id="entry-kind" class="entry-kind-toggle" role="group" aria-labelledby="entry-kind-label">
          <button
            class="kind-option secret"
            type="button"
            data-entry-kind="secret"
            aria-pressed="true"
            aria-label="Secret · hidden in the UI"
            title="Secret · hidden in the UI"
          >
            <svg
              class="lucide lucide-lock-keyhole"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="16" r="1"></circle>
              <rect x="3" y="10" width="18" height="12" rx="2"></rect>
              <path d="M7 10V7a5 5 0 0 1 10 0v3"></path>
            </svg>
            <span class="visually-hidden">Secret</span>
          </button>
          <button
            class="kind-option variable"
            type="button"
            data-entry-kind="variable"
            aria-pressed="false"
            aria-label="Variable · visible in the UI"
            title="Variable · visible in the UI"
          >
            <svg
              class="lucide lucide-eye"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2.062 12.348a1 1 0 0 1 0-.696C3.732 7.456 7.523 5 12 5c4.477 0 8.268 2.456 9.938 6.652a1 1 0 0 1 0 .696C20.268 16.544 16.477 19 12 19c-4.477 0-8.268-2.456-9.938-6.652"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span class="visually-hidden">Variable</span>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="entry-key">Key</label>
        <input id="entry-key" value="weather.city" maxlength="128" autocomplete="off" spellcheck="false">
      </div>
      <div class="field value-field">
        <label for="entry-value">Value</label>
        <input id="entry-value" type="password" maxlength="16384" autocomplete="new-password" spellcheck="false" placeholder="e.g. Vancouver">
      </div>
      <button id="save-entry" type="button">Save in memory</button>
      <p id="editor-message" aria-live="polite"></p>
    </section>

    <section class="inventory" aria-labelledby="inventory-title">
      <div class="inventory-heading">
        <h2 id="inventory-title">Stored entries</h2>
        <span id="key-count">0</span>
      </div>
      <div id="key-list" aria-live="polite"></div>
    </section>

    <script type="module" src="/privacy.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sample Background Task</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Sample task / every 5 seconds</p>
        <h1>Heartbeat</h1>
      </div>
      <span id="connection-status" class="status waiting">Waiting for broker</span>
    </header>

    <section class="task-config">
      <label for="secret-key">Secret key requested by this task</label>
      <input id="secret-key" value="demo.secret" maxlength="128" autocomplete="off" spellcheck="false">
      <p>Only one request may be in flight. Successful values are masked and released after each run.</p>
    </section>

    <section class="activity">
      <div class="activity-heading">
        <h2>Task activity</h2>
        <span id="run-state">Idle</span>
      </div>
      <ol id="activity-log" aria-live="polite"></ol>
    </section>

    <script src="/task.js"></script>
  </body>
</html>

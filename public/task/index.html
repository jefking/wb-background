<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sample Background Task</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Runtime SDK example</p>
        <h1>Heartbeat</h1>
      </div>
      <span class="status ready">Every 5 seconds</span>
    </header>

    <section class="task-config">
      <h2>Registered task</h2>
      <p><code>heartbeat</code> requests <code>demo.secret</code> through the runtime’s <code>getSecret</code> hook.</p>
    </section>

    <section class="activity">
      <div class="activity-heading">
        <h2>Output</h2>
        <span id="run-state">Browser console</span>
      </div>
      <p>Approve the request in the host. Each completed run prints a message without printing the secret value.</p>
    </section>

    <script type="module" src="/task-example/index.js"></script>
  </body>
</html>
